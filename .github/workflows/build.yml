# This workflow will install Python dependencies, run tests with a variety of Python versions

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13, 3.14]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }} ${{ matrix.architecture }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: cache Linux
      uses: actions/cache@v4
      if: startsWith(runner.os, 'Linux')
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_test.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.architecture }}-${{ runner.python-version }}pip-
    - name: cache MacOS
      uses: actions/cache@v4
      if: startsWith(runner.os, 'macOS')
      with:
        path: ~/Library/Caches/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_test.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.architecture }}-${{ runner.python-version }}pip-
    - name: cache Windows
      uses: actions/cache@v4
      if: startsWith(runner.os, 'Windows')
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_test.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.architecture }}-${{ runner.python-version }}pip-
    - name: Install Graphviz
      # Optional: graphviz tests are skipped when the `dot` executable is missing.
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install dependencies
      env:
        # On a pull request this is the PR's source branch; on a push it is the pushed branch.
        BRANCH: ${{ github.head_ref || github.ref_name }}
        # Owner of the repository the PR comes from (differs from the upstream org for PRs from forks).
        HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
      run: |
        # Return a pip-installable git URL for a submodule repository. If a branch with the same
        # name as this branch exists in the submodule (first in the PR author's fork, then in
        # the upstream repository), use that branch; otherwise use the default branch.
        submodule_url() {
          local owner=$1 repo=$2 candidate
          for candidate in "$HEAD_OWNER/$repo" "$owner/$repo"; do
            if git ls-remote --exit-code --heads "https://github.com/$candidate.git" "$BRANCH" > /dev/null 2>&1; then
              echo "Using branch '$BRANCH' of $candidate" >&2
              echo "git+https://github.com/$candidate.git@$BRANCH"
              return
            fi
          done
          echo "No branch '$BRANCH' in $repo; using default branch of $owner/$repo" >&2
          echo "git+https://github.com/$owner/$repo.git"
        }
        python -c "import platform; print(platform.platform()); print(platform.architecture())"
        python -m pip install --upgrade pip
        python -m pip install wheel
        pip install --no-cache-dir git+https://github.com/CalebBell/fluids.git
        pip install --no-cache-dir git+https://github.com/CalebBell/chemicals.git
        pip install --no-cache-dir git+https://github.com/CalebBell/thermo.git
        pip install --no-cache-dir "$(submodule_url BioSTEAMDevelopmentGroup thermosteam)"
        pip install --no-cache-dir "$(submodule_url BioSTEAMDevelopmentGroup Bioindustrial-Park)"
        # Bioindustrial-Park pulls biosteam (and therefore hensmith) from PyPI. A git install with
        # the same version number would be skipped as "already satisfied", so force it.
        pip install --no-cache-dir --no-deps --force-reinstall "$(submodule_url BioSTEAMDevelopmentGroup hensmith)"
        pip install -r requirements_test.txt
        pip install --no-cache-dir git+https://github.com/QSD-Group/QSDsan.git
        pip install --no-cache-dir git+https://github.com/QSD-Group/EXPOsan.git
        pip uninstall biosteam -y
        pip install -e .
    - name: Test without numba
      run: |
        pytest . -v --disable-numba=1 --cov=biosteam --cov-report=term-missing --cov-report=lcov -m "not slow"
    - name: Upload coverage to Coveralls
      # Only report coverage for builds of the master branch (not pull requests).
      if: github.ref == 'refs/heads/master'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.lcov
        format: lcov
        flag-name: python-${{ matrix.python-version }}
        parallel: true
  finish:
    needs: build
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
        carryforward: python-3.13,python-3.14
