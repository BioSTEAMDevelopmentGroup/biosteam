# Sanitize patterns applied by nbval (--nbval-sanitize-with) to both the
# stored and the freshly computed notebook outputs before comparing them.
# Each pattern is a "regex:" line immediately followed by a "replace:" line.

[whitespace]
# Collapse runs of spaces/tabs so changes in column padding of reprs
# (e.g. ChemicalIndexer / MolarFlowIndexer) do not fail the docs tests.
regex: [ \t]+
replace: <ws>
